<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nohalow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: thanh tab dính mép trái, chia nhóm (App / Game / Công cụ...), cuộn được khi có nhiều sản phẩm. Mỗi sản phẩm là một trang riêng bên phải, tạo từ danh sách PRODUCTS trong script. */
:root{
  --bg:#080B14; --rail:#0A0F1C; --card:#0C1120; --line:#1A2438; --text:#F3F7FB; --muted:#9AA8BD;
  --acc:#22C55E; --acc-ink:#04260F; --acc2:#22D3EE;
  --display:"Chakra Petch","Arial Narrow",Impact,system-ui,sans-serif;
  --body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail-w:236px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--body);padding:0;min-height:100%}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
p{margin:0 0 10px}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* ===== thanh tab mép trái ===== */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 0 14px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;padding:0 16px 14px;text-decoration:none;flex:none}
.logo i{width:32px;height:32px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font:700 18px var(--display);font-style:normal;box-shadow:inset -3px -3px #0006,inset 3px 3px #fff4}
.logo b{font:700 19px var(--display);letter-spacing:.04em}
.logo b span{color:var(--acc)}
.cat{position:relative;flex:none;padding:0 12px 8px}
.catlab{margin:4px 2px 6px;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.catbtn{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid #2A3750;background:#0E1626;cursor:pointer;font:700 15px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
.catbtn:hover,.catbtn[aria-expanded="true"]{border-color:var(--acc)}
.catbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.catbtn small{font:500 12px var(--body);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:4px}
.catbtn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.catbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.catmenu{position:absolute;left:12px;right:12px;top:calc(100% - 8px);z-index:40;background:#0F182B;border:1px solid #2A3750;box-shadow:0 14px 34px #000c;padding:4px}
.catmenu button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px;cursor:pointer;font:600 15px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.catmenu button:hover,.catmenu button:focus-visible{background:#17233B}
.catmenu button[aria-checked="true"]{color:var(--acc)}
.catmenu small{font:500 12px var(--body);letter-spacing:0;color:var(--muted)}
.tabs{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:#1F2B42 transparent}
.lab{padding:0 16px;margin:12px 0 6px;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tab{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:11px 16px 11px 13px;border-left:3px solid transparent;cursor:pointer;color:var(--muted);position:relative}
.tab:hover{background:#0E1626;color:var(--text)}
.tab .tn{font:700 18px var(--display);letter-spacing:.02em;text-transform:none;color:inherit}
.tab .ts{font-size:13px}
.tab[aria-selected="true"]{background:#101A2E;border-left-color:var(--tc);color:var(--text)}
.tab[aria-selected="true"] .tn{color:var(--tc)}
.tab:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.tab .soon{position:absolute;right:12px;top:13px;padding:1px 8px;border:1px dashed #33425F;border-radius:999px;font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.foot{flex:none;border-top:1px solid var(--line);padding-top:6px}
.links{display:flex;flex-direction:column;padding:0 8px}
.links a{display:flex;align-items:center;gap:10px;padding:6px 8px;color:var(--muted);text-decoration:none;font-size:14px}
.links a:hover{color:var(--text);background:#0E1626}
.links svg{width:17px;height:17px;fill:currentColor;flex:none}
.mail{padding:6px 16px 0;font-size:12px;color:var(--muted);word-break:break-all}
.mail code{font:500 12px var(--mono);color:var(--text)}
.mail button{all:unset;cursor:pointer;margin-left:6px;color:var(--acc);font-size:12px}
.mail button:hover{text-decoration:underline}
.lang{all:unset;box-sizing:border-box;cursor:pointer;display:block;margin:10px 16px 0;padding:5px 12px;border:1px solid var(--line);text-align:center;font:600 13px var(--display);letter-spacing:.08em;color:var(--text)}
.lang:hover{border-color:var(--acc);color:var(--acc)}

/* ===== nội dung ===== */
main{overflow-x:clip;margin-left:var(--rail-w);padding-inline:clamp(16px,4vw,56px);padding-block:0 40px}
.page{max-width:1080px;margin-inline:auto}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:64px 56px;position:relative}
.hero.solo{grid-template-columns:minmax(0,1fr);padding-block:96px}
.hero::before{content:"";position:absolute;inset:-10% -20% auto auto;width:70%;height:90%;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 20%,transparent),transparent);pointer-events:none;z-index:0}
.hero>*{position:relative;z-index:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border:1px solid var(--line);border-radius:999px;background:#0C1322;font:500 12px var(--body);letter-spacing:.08em;text-transform:uppercase;margin-bottom:22px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
h1{font-size:clamp(34px,4.6vw,56px);line-height:1.08;font-weight:700;margin-bottom:20px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;color:var(--muted);max-width:50ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:1px solid #2A3750;background:#10192B;color:var(--text)}
.btn:hover{background:#17233B}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:inset -4px -4px #00000040,inset 4px 4px #ffffff55}
.btn.pri:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meta{margin-top:14px;font-size:13px;color:var(--muted)}
.win{border:1px solid var(--line);border-radius:10px;background:#0A0D14;box-shadow:0 0 60px -14px color-mix(in srgb,var(--acc) 45%,transparent);overflow:hidden}
.win .dots{display:flex;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);background:#0B1019}
.win .dots i{width:11px;height:11px;border-radius:50%}
.win .dots i:nth-child(1){background:#ef4444}.win .dots i:nth-child(2){background:#eab308}.win .dots i:nth-child(3){background:#22c55e}
.win img{width:100%;height:auto}

.sec{border-top:1px solid var(--line);padding-block:56px}
.sec h2{font-size:clamp(26px,3.2vw,38px);line-height:1.12;margin-bottom:12px}
.sec h2 em{font-style:normal;color:var(--acc)}
.sec .sub{color:var(--muted);max-width:56ch;margin-bottom:30px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.feat{padding:22px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.feat:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.feat .ic{width:44px;height:44px;display:grid;place-items:center;margin-bottom:16px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border-radius:6px}
.feat .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feat h3{font-size:17px;margin-bottom:6px}
.feat p{margin:0;font-size:15px;color:var(--muted)}

.how{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center}
.how.one{grid-template-columns:minmax(0,1fr)}
.how>*{min-width:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:16px}
.steps li::before{content:counter(s);width:44px;height:44px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font:700 20px var(--display);box-shadow:inset -3px -3px #0004,inset 3px 3px #fff5}
.steps b{display:block;font:700 18px var(--display);text-transform:uppercase}
.steps span{color:var(--muted);font-size:15px}
.term{border:1px solid var(--line);border-radius:10px;background:#090D17;overflow:hidden}
.term .dots{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line)}
.term .dots i{width:11px;height:11px;border-radius:50%}
.term .dots i:nth-child(1){background:#ef4444}.term .dots i:nth-child(2){background:#eab308}.term .dots i:nth-child(3){background:#22c55e}
.term .dots span{margin-left:10px;font:12px var(--mono);color:var(--muted)}
.term pre{margin:0;padding:18px;font:13px/1.9 var(--mono);color:var(--muted);overflow-x:auto}
.term .y{color:#EAB308}.term .g{color:#22C55E;font-weight:700}.term .c{color:#22D3EE}

.upd{display:flex;gap:18px;padding:14px 0;border-top:1px solid var(--line)}
.upd:first-child{border-top:0}
.upd .d{flex:none;width:68px;font:600 13px var(--mono);color:var(--acc);padding-top:3px}
.upd p{margin:0}
.upd b{font-family:var(--display);text-transform:uppercase}
footer.fine{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

@media (max-width:900px){
  .hero,.how{grid-template-columns:minmax(0,1fr)}
  .hero{padding-block:36px 40px}
  .hero.solo{padding-block:56px}
}
@media (max-width:760px){
  /* điện thoại: thanh tab chuyển lên mép trên, vuốt ngang khi có nhiều sản phẩm */
  .rail{position:sticky;top:env(safe-area-inset-top,0px);width:auto;bottom:auto;flex-direction:row;align-items:center;padding:0;border-right:0;border-bottom:1px solid var(--line)}
  .logo{padding:0 12px;flex:none}.logo b{display:none}
  .foot{display:none}
  .cat{padding:0 4px;flex:none}.catlab{display:none}
  .catbtn{padding:8px 10px;font-size:13px}.catbtn small{display:none}
  .catmenu{left:0;right:auto;min-width:200px;top:100%}
  .tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0;flex:1}
  .lab{display:none}
  .tab{border-left:0;border-bottom:3px solid transparent;padding:10px 16px;flex:none;align-items:center;text-align:center}
  .tab[aria-selected="true"]{border-left-color:transparent;border-bottom-color:var(--tc)}
  .tab .ts,.tab .soon{display:none}
  .mlang{display:block!important}
  main{margin-left:0}
  .upd{flex-direction:column;gap:2px}
}
.mlang{all:unset;display:none;box-sizing:border-box;cursor:pointer;flex:none;margin:0 10px;padding:4px 10px;border:1px solid var(--line);font:600 13px var(--display);letter-spacing:.08em;color:var(--text)}

/* ===== animation ===== */
@property --acc{syntax:"<color>";inherits:true;initial-value:#22C55E}
@property --acc-ink{syntax:"<color>";inherits:true;initial-value:#04260F}
@property --acc2{syntax:"<color>";inherits:true;initial-value:#22D3EE}
:root{transition:--acc .7s ease,--acc-ink .7s ease,--acc2 .7s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tabin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes blink{50%{opacity:0}}
@keyframes lnin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}

#vox{position:fixed;top:0;right:0;bottom:0;left:var(--rail-w);width:calc(100% - var(--rail-w));height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}

/* thanh tab: vạch trượt + tab hiện lần lượt */
.tabs{position:relative}
.tab{animation:tabin .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n,0)*60ms);transition:background .2s,color .2s}
.tab[aria-selected="true"]{border-left-color:transparent}
.ind{position:absolute;left:0;top:var(--iy,0);width:3px;height:var(--ih,0);background:var(--acc);box-shadow:0 0 14px var(--acc);transition:top .38s cubic-bezier(.3,.8,.2,1),height .38s cubic-bezier(.3,.8,.2,1)}
.catmenu:not([hidden]){animation:pop .18s ease-out}
.catmenu button{transition:background .15s,padding-left .15s}
.catmenu button:hover{padding-left:14px}

/* đầu trang sản phẩm */
.hero::before{animation:glow 6s ease-in-out infinite}
.hero .badge,.hero .lead,.hero .cta,.hero .meta{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero .lead{animation-delay:.42s}.hero .cta{animation-delay:.52s}.hero .meta{animation-delay:.62s}
.hero .badge::before{animation:blink 2.4s ease-in-out infinite}
h1 .w{display:inline-block;animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(90ms + var(--i,0)*70ms)}
h1 em{background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc));background-size:200% 100%;-webkit-background-clip:text;background-clip:text}
h1 em.w{animation:rise .7s cubic-bezier(.2,.7,.2,1) both,shimmer 6s linear infinite;animation-delay:calc(90ms + var(--i,0)*70ms),0s}
.floaty{animation:rise .9s cubic-bezier(.2,.7,.2,1) .25s both,float 7s ease-in-out 1.3s infinite}
.win{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,box-shadow .3s;will-change:transform}
.win:hover{box-shadow:0 0 90px -12px color-mix(in srgb,var(--acc) 60%,transparent)}

/* nút */
.btn{transition:transform .15s,background .15s,filter .15s,box-shadow .15s}
.btn.pri{position:relative;overflow:hidden}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.btn.pri:hover::after{transform:translateX(130%);transition:transform .7s ease}
.btn.pri:active{transform:translateY(1px);box-shadow:inset 4px 4px #00000040,inset -4px -4px #ffffff55}
.btn svg{transition:transform .2s}
.btn.pri:hover svg{transform:translateY(2px)}

/* hiện dần khi cuộn tới (mờ nhẹ lúc đầu, không biến mất hẳn) */
.rv{opacity:.18;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),border-color .2s,box-shadow .2s;transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.feat{background:radial-gradient(220px circle at var(--mx,50%) var(--my,-60%),color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),var(--card)}
.feat.in:hover{transform:translateY(-4px);box-shadow:0 16px 32px -16px color-mix(in srgb,var(--acc) 55%,transparent)}
.feat .ic{transition:transform .25s}
.feat:hover .ic{transform:scale(1.1) rotate(-5deg)}
.steps li{position:relative}
.steps li::before{transform:scale(.6);transition:transform .5s cubic-bezier(.3,1.6,.5,1) .15s}
.steps li.in::before{transform:none}
.steps li:not(:last-child)::after{content:"";position:absolute;left:21px;top:48px;bottom:-18px;width:2px;background:linear-gradient(var(--acc),transparent);transform:scaleY(0);transform-origin:top;transition:transform .7s ease .35s;opacity:.55}
.steps li.in:not(:last-child)::after{transform:scaleY(1)}
.term .ln{display:inline}
.term .ln.pop{animation:lnin .25s ease-out both}
.term .cur{display:inline-block;width:8px;height:15px;margin-left:4px;vertical-align:-2px;background:var(--acc2);animation:blink 1s steps(1) infinite}
.upd{transition:padding-left .2s}.upd:hover{padding-left:6px}

@media (max-width:760px){
  #vox{left:0;width:100%}
  .ind{left:var(--ix,0);top:auto;bottom:0;width:var(--iw,0);height:3px;transition:left .38s cubic-bezier(.3,.8,.2,1),width .38s cubic-bezier(.3,.8,.2,1)}
  .tab[aria-selected="true"]{border-bottom-color:transparent}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
  #vox{display:none}
}

</style>

</head>
<body>

</aside>

<main>
  <div id="pages"></div>

var lang = "vi", current = null, cat = null;

function L(o) { return o ? (o[lang] || o.vi || "") : ""; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function byId(id) { for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i]; return null; }
function paint(p) {
  var r = document.documentElement.style;
  r.setProperty("--acc", p.color); r.setProperty("--acc-ink", p.ink || "#05101F"); r.setProperty("--acc2", p.color2 || p.color);
}

function tabHtml(p, n) {
  return '<button class="tab" role="tab" id="tab-' + esc(p.id) + '" aria-controls="p-' + esc(p.id) + '" aria-selected="false" tabindex="-1" type="button" style="--tc:' + esc(p.color) + ';--n:' + (n || 0) + '">' +
    '<span class="tn">' + esc(p.name) + '</span><span class="ts">' + esc(L(p.sub)) + '</span>' +
    (p.status === "soon" ? '<span class="soon">' + esc(L(UI.soon)) + '</span>' : '') + '</button>';
}
function groupsWithItems() { return GROUPS.filter(function (g) { return PRODUCTS.some(function (p) { return p.group === g.id; }); }); }
function countIn(g) { return PRODUCTS.filter(function (p) { return p.group === g; }).length; }
function renderRail() {
  var gs = groupsWithItems();
  if (!gs.some(function (g) { return g.id === cat; })) cat = gs[0] ? gs[0].id : null;
  var cur = GROUPS.filter(function (g) { return g.id === cat; })[0];
  document.getElementById("cat").innerHTML =
    '<div class="catlab">' + esc(L(UI.category)) + '</div>' +
    '<button class="catbtn" id="catbtn" type="button" aria-haspopup="menu" aria-expanded="false"><span>' + esc(cur ? L(cur.label) : "") + '<small>(' + (cur ? countIn(cur.id) : 0) + ')</small></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>' +
    '<div class="catmenu" id="catmenu" role="menu" hidden>' + gs.map(function (g) {
      return '<button type="button" role="menuitemradio" aria-checked="' + (g.id === cat) + '" data-g="' + esc(g.id) + '"><span>' + esc(L(g.label)) + '</span><small>' + countIn(g.id) + '</small></button>';
    }).join("") + '</div>';
  document.getElementById("tabs").innerHTML = PRODUCTS.filter(function (p) { return p.group === cat; }).map(function (p, i) { return tabHtml(p, i); }).join("") + '<span class="ind" aria-hidden="true"></span>';
}
function setMenu(open) {
  var btn = document.getElementById("catbtn"), menu = document.getElementById("catmenu");
  if (!btn || !menu) return;
  btn.setAttribute("aria-expanded", open ? "true" : "false"); menu.hidden = !open;
  if (open) { var c = menu.querySelector('[aria-checked="true"]') || menu.querySelector("button"); if (c) c.focus(); }
}
function updatesHtml(p) {
  var list = UPDATES.filter(function (u) { return u.app === p.id; }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  if (!list.length) return "";
  return '<section class="sec"><h2>' + L(UI.updates) + '</h2>' + list.map(function (u) {
    var d = u.date.split("-"), ds = d.length === 3 ? d[2] + "/" + d[1] + "/" + d[0] : d[1] + "/" + d[0];
    return '<div class="upd"><span class="d">' + esc(ds) + '</span><p><b>' + esc(p.name + (u.version ? " " + u.version : "")) + '</b>: ' + esc(L(u)) + '</p></div>';
  }).join("") + '</section>';
}
function pageHtml(p) {
  var soon = p.status === "soon";
  var btns = (p.buttons || []).map(function (b) {
    return '<a class="btn' + (b.primary ? ' pri' : '') + '" href="' + esc(b.href) + '">' +
      (b.icon && ICONS[b.icon] ? '<svg viewBox="0 0 24 24"><path d="' + ICONS[b.icon] + '"/></svg>' : '') + '<span>' + esc(L(b.label)) + '</span></a>';
  }).join("");
  var h = '<section class="hero' + (p.image ? '' : ' solo') + '"><div>' +
    '<span class="badge">' + esc(L(p.badge)) + '</span><h1>' + L(p.title) + '</h1><p class="lead">' + esc(L(p.lead)) + '</p>' +
    (btns ? '<div class="cta">' + btns + '</div>' : '') + (p.meta ? '<p class="meta">' + esc(L(p.meta)) + '</p>' : '') + '</div>' +
    (p.image ? '<div class="floaty"><div class="win"><div class="dots"><i></i><i></i><i></i></div><img src="' + esc(p.image) + '" width="' + (p.imageSize ? p.imageSize[0] : 1000) + '" height="' + (p.imageSize ? p.imageSize[1] : 560) + '" alt="' + esc(L(p.imageAlt)) + '"></div></div>' : '') +
    '</section>';
  if (p.features) {
    h += '<section class="sec"><h2>' + L(p.features.title) + '</h2><p class="sub">' + esc(L(p.features.sub)) + '</p><div class="feats">' +
      p.features.items.map(function (f) {
        return '<div class="feat"><div class="ic"><svg viewBox="0 0 24 24"><path d="' + (ICONS[f.icon] || ICONS.star) + '"/></svg></div><h3>' + esc(L(f.title)) + '</h3><p>' + esc(L(f.text)) + '</p></div>';
      }).join("") + '</div></section>';
  }
  if (p.steps) {
    h += '<section class="sec"><div class="how' + (p.terminal ? '' : ' one') + '"><div><h2>' + L(p.steps.title) + '</h2><p class="sub">' + esc(L(p.steps.sub)) + '</p><ol class="steps">' +

      '</div></section>';
  }
  return h + updatesHtml(p);
}
function renderPages() {
  document.getElementById("pages").innerHTML = PRODUCTS.map(function (p) {
    return '<div class="page" id="p-' + esc(p.id) + '" role="tabpanel" aria-labelledby="tab-' + esc(p.id) + '" hidden>' + pageHtml(p) + '</div>';
  }).join("");
}

function show(id, opts) {
  var p = byId(id) || PRODUCTS[0]; if (!p) return;
  current = p.id; paint(p);
  if (p.group !== cat) { cat = p.group; renderRail(); }
  PRODUCTS.forEach(function (q) {
    var on = q.id === p.id, t = document.getElementById("tab-" + q.id), pg = document.getElementById("p-" + q.id);
    if (t) { t.setAttribute("aria-selected", on ? "true" : "false"); t.tabIndex = on ? 0 : -1; }
    if (pg) pg.hidden = !on;
  });
  setVoxColor(p.color); updateInd();
  var act = document.getElementById("tab-" + p.id);
  if (opts && opts.focus && act) act.focus();
  if (act && act.scrollIntoView) { try { act.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) {} }
  if (!(opts && opts.keepScroll)) window.scrollTo(0, 0);
  if (!(opts && opts.noHash)) { try { history.replaceState(null, "", "#" + p.id); } catch (e) {} }
}
function render() {
  document.documentElement.lang = lang;
  renderRail(); renderPages(); enhance();
  document.getElementById("lab-connect").textContent = L(UI.connect);
  document.getElementById("copy").textContent = L(UI.copy);
  document.getElementById("lang").textContent = document.getElementById("lang2").textContent = lang === "vi" ? "EN" : "VI";
  show(current || (location.hash || "").slice(1) || (PRODUCTS[0] && PRODUCTS[0].id), { keepScroll: true, noHash: true });
}

document.getElementById("cat").addEventListener("click", function (e) {
  var g = e.target.closest("[data-g]");
  if (g) {
    cat = g.getAttribute("data-g"); renderRail();
    var first = PRODUCTS.filter(function (p) { return p.group === cat; })[0];
    if (first) show(first.id);
    var b = document.getElementById("catbtn"); if (b) b.focus();
    return;
  }
  if (e.target.closest("#catbtn")) setMenu(document.getElementById("catmenu").hidden);
});
document.getElementById("cat").addEventListener("keydown", function (e) {
  var menu = document.getElementById("catmenu");
  if (!menu || menu.hidden) return;
  if (e.key === "Escape") { setMenu(false); document.getElementById("catbtn").focus(); return; }
  var items = Array.prototype.slice.call(menu.querySelectorAll("button")), i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus(); }
});
document.addEventListener("click", function (e) { if (!e.target.closest("#cat")) setMenu(false); });
document.getElementById("tabs").addEventListener("click", function (e) {
  var t = e.target.closest(".tab"); if (t) show(t.id.slice(4));
});
document.getElementById("tabs").addEventListener("keydown", function (e) {
  var t = e.target.closest(".tab"); if (!t) return;
  var all = Array.prototype.slice.call(document.querySelectorAll(".tab")), i = all.indexOf(t), k = e.key;
  var n = k === "ArrowDown" || k === "ArrowRight" ? 1 : k === "ArrowUp" || k === "ArrowLeft" ? -1 : 0;
  if (n) { e.preventDefault(); show(all[(i + n + all.length) % all.length].id.slice(4), { focus: true }); }
});

/* ===== hiệu ứng ===== */
var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var io = null, typedOnce = false;

function updateInd() {
  var t = document.querySelector('.tab[aria-selected="true"]'), ind = document.querySelector(".ind");
  if (!t || !ind) return;
  ind.style.setProperty("--iy", t.offsetTop + "px"); ind.style.setProperty("--ih", t.offsetHeight + "px");
  ind.style.setProperty("--ix", t.offsetLeft + "px"); ind.style.setProperty("--iw", t.offsetWidth + "px");
}
function splitTitle(h) {
  var idx = 0, kids = Array.prototype.slice.call(h.childNodes);
  h.textContent = "";
  kids.forEach(function (n) {
    if (n.nodeType === 3) {
      n.textContent.split(/(\s+)/).forEach(function (part) {
        if (!part) return;
        if (/^\s+$/.test(part)) { h.appendChild(document.createTextNode(" ")); return; }
        var sp = document.createElement("span"); sp.className = "w"; sp.style.setProperty("--i", idx++); sp.textContent = part; h.appendChild(sp);
      });
    } else { n.classList.add("w"); n.style.setProperty("--i", idx++); h.appendChild(n); }
  });
}
function typeTerm(el) {
  var pre = el.querySelector("pre");
  if (!pre || typedOnce || REDUCED) return;
  typedOnce = true;
  var lines = pre.innerHTML.split("\n");
  pre.innerHTML = lines.map(function (l) { return '<span class="ln">' + l + "</span>"; }).join("\n");
  var ls = pre.querySelectorAll(".ln"), cur = document.createElement("span"), i = 0;
  cur.className = "cur";
  Array.prototype.forEach.call(ls, function (l) { l.style.visibility = "hidden"; });
  (function step() {
    if (i >= ls.length) return;
    var l = ls[i++]; l.style.visibility = "visible"; l.classList.add("pop"); l.appendChild(cur);
    setTimeout(step, i === ls.length - 1 ? 700 : 240);
  })();
}
function enhance() {
  document.querySelectorAll(".hero h1").forEach(splitTitle);
  if (io) { io.disconnect(); io = null; }
  var targets = Array.prototype.slice.call(document.querySelectorAll(".sec h2, .sec .sub, .feat, .steps li, .term, .upd"));
  targets.forEach(function (el) {
    el.classList.add("rv");
    var k = Array.prototype.indexOf.call(el.parentNode.children, el);
    el.style.setProperty("--d", Math.min(k, 6) * 80 + "ms");
  });
  if (REDUCED || !("IntersectionObserver" in window)) { targets.forEach(function (el) { el.classList.add("in"); }); return; }
  io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var el = en.target; el.classList.add("in"); io.unobserve(el);
      setTimeout(function () { el.style.removeProperty("--d"); }, 1500);
      if (el.classList.contains("term")) typeTerm(el);
    });
  }, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" });
  targets.forEach(function (el) { io.observe(el); });
}

/* nghiêng ảnh app theo chuột, đèn rọi trên thẻ tính năng */
var pagesEl = document.getElementById("pages");
pagesEl.addEventListener("pointermove", function (e) {
  if (e.pointerType !== "mouse") return;
  var f = e.target.closest(".feat");
  if (f) { var r = f.getBoundingClientRect(); f.style.setProperty("--mx", (e.clientX - r.left) + "px"); f.style.setProperty("--my", (e.clientY - r.top) + "px"); }
  var hero = e.target.closest(".hero"), w = hero && hero.querySelector(".win");
  if (w) {
    var b = hero.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - 0.5, y = (e.clientY - b.top) / b.height - 0.5;
    w.style.setProperty("--ry", (x * 8).toFixed(2) + "deg"); w.style.setProperty("--rx", (-y * 6).toFixed(2) + "deg");
  }
});
pagesEl.addEventListener("mouseout", function (e) {
  if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".hero")) return;
  document.querySelectorAll(".win").forEach(function (w) { w.style.removeProperty("--rx"); w.style.removeProperty("--ry"); });
});

/* khối vuông trôi lên (như block Minecraft) ở nền, màu theo sản phẩm đang xem */
var voxRGB = [34, 197, 94];
function setVoxColor(hex) {
  var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
  if (m) voxRGB = [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
}
(function () {
  if (REDUCED) return;
  var c = document.getElementById("vox"), x = c.getContext("2d"), P = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function make(first) {
    var sz = 6 + Math.random() * 14;
    return { x: Math.random() * W, y: first ? Math.random() * H : H + sz, s: sz, v: 0.12 + Math.random() * 0.3, a: 0.05 + Math.random() * 0.13, p: Math.random() * 6.28 };
  }
  function size() {
    var r = c.getBoundingClientRect(); W = r.width; H = r.height;
    c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.max(12, Math.min(34, Math.round(W * H / 42000)));
    P = []; for (var i = 0; i < n; i++) P.push(make(true));
  }
  function frame(t) {
    x.clearRect(0, 0, W, H);
    var col = voxRGB.join(",");
    P.forEach(function (q) {
      q.y -= q.v; q.x += Math.sin(t / 2600 + q.p) * 0.12;
      if (q.y < -q.s) { Object.assign(q, make(false)); }
      var fade = Math.min(1, Math.max(0, (q.y + q.s) / (H * 0.2))) * Math.min(1, (H - q.y) / (H * 0.12));
      x.globalAlpha = q.a * fade;
      x.fillStyle = "rgb(" + col + ")"; x.fillRect(q.x, q.y, q.s, q.s);
      x.fillStyle = "#fff"; x.globalAlpha = q.a * fade * 0.5; x.fillRect(q.x, q.y, q.s, Math.max(2, q.s * 0.18)); x.fillRect(q.x, q.y, Math.max(2, q.s * 0.18), q.s);
    });
    requestAnimationFrame(frame);
  }
  size(); window.addEventListener("resize", size); requestAnimationFrame(frame);
})();

render();
